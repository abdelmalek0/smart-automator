[project]
name = "smart-automator"
version = "0.1.0"
description = "AI-powered browser automation tool using Playwright"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=4.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "json-repair>=0.39.1",
    "loguru>=0.7.3",
    "playwright>=1.48.0",
    "pydantic>=2.10.6",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "rich>=14.3.4",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
smart-automator = "smart_automator.main:main"
smart-automator-api = "smart_automator.server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/smart_automator/browser/assets/buildDomTree.js" = "smart_automator/browser/assets/buildDomTree.js"
